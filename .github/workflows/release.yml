name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build universal GitView.app bundle
        run: Scripts/make-app.sh --universal

      - name: Package zip archive
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-manual}"
          ARCHIVE="GitView-${TAG_NAME}-macos-universal.zip"
          ditto -c -k --keepParent build/GitView.app "$ARCHIVE"
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          generate_release_notes: true

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GitView-macos-universal
          path: ${{ env.ARCHIVE_PATH }}
